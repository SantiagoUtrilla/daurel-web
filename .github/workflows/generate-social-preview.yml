name: Generar imagen social DAUREL

on:
  push:
    branches:
      - fix/facebook-og-preview-20261109
    paths:
      - scripts/build-social-preview.py
      - .github/workflows/generate-social-preview.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código del proyecto
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Pillow
        run: python -m pip install pillow
      - name: Crear tarjeta de 1200 x 630
        run: python scripts/build-social-preview.py
      - name: Verificar archivo generado
        run: |
          python - <<'PY'
          from PIL import Image
          image=Image.open("public/assets/social-preview.png")
          assert image.size == (1200, 630)
          assert image.format == "PNG"
          print("Imagen válida:", image.size)
          PY
      - name: Guardar imagen en esta rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/social-preview.png
          if ! git diff --cached --quiet; then
            git commit -m "asset(og): publicar imagen social con logo existente"
            git push origin HEAD:fix/facebook-og-preview-20261109
          fi
